# Default Hyperparameters

training:
  optimizer: AdamW
  lr: 3e-4
  weight_decay: 1e-2
  batch_size: 64
  epochs: 50
  device: "cpu"
  eval_every: 1
  checkpoint_every: 10
  log_wandb: false
  wandb_project: "snn-dt"

model:
  name: "dt" # dt, snn_dt, dsformer, iql, cql
  d_model: 128
  n_layers: 2
  n_heads: 4
  seq_len: 20
  action_tanh: false

snn:
  T: 10
  eta_local: 0.05
  lif_tau: 20
  surrogate_k: 10

iql:
  hidden_size: 256
  tau: 5e-3
  temperature: 3.0
  expectile: 0.7

cql:
  hidden_size: 256
  tau: 5e-3
  temperature: 1.0
  cql_weight: 1.0
  target_action_gap: 10.0
  with_lagrange: false

dataset:
  path: "data/CartPole-v1/dataset_v1.npz"
  max_timesteps: 1000 # a reasonable upper bound for classic control envs
  state_dim: 4
  act_dim: 1 