envs: ["CartPole-v1"]
datasets_per_env:
  steps: 10000
  mix: "return-stratified (40/30/30 low/mid/high)"
sequence_length_N: 20
spiking_window_T: 4
hidden_dim_d: 128
num_layers_L: 2
num_heads_H: 4
batch_size: 64
optimizer: AdamW
lr: 3e-4
weight_decay: 1e-2
epochs: 10
local_lr_eta_local: 0.05
surrogate_slope_k: 25
spike_energy_pJ: 5.0
seeds: [0]
log_interval_steps: 50
checkpoint_interval_epochs: 10
eval_rollouts: 10
