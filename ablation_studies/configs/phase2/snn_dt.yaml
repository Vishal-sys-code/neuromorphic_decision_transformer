model:
  name: snn_dt
  # Optimization for CartPole
  d_model: 128
  n_heads: 4
  n_layers: 2
  seq_len: 20
snn:
  lif_tau: 20.0
  v_th: 1.0        # Increased from 0.6 to reduce spiking
  current_scale: 0.2 # Decreased from 1.0 to reduce spiking
  surrogate_k: 10.0 # Matched to contract
  biological_time: 10 # Matched to contract
  use_plasticity: true
  eta_local: 0.05