envs: ["CartPole-v1", "Acrobot-v1", "Pendulum-v1", "MountainCar-v0"]
datasets_per_env:
  steps: 10000
  mix: "return-stratified (40/30/30 low/mid/high)"
sequence_length_N: 10
spiking_window_T: 4
hidden_dim_d: 128
num_layers_L: 2
num_heads_H: 4
batch_size: 32
batches_per_epoch: 100
optimizer: AdamW
lr: 3e-4
weight_decay: 1e-2
epochs: 100
local_lr_eta_local: 0.05
surrogate_slope_k: 10
spike_energy_pJ: 5.0
seeds: [0, 1, 2, 3, 4]
log_interval_steps: 250
checkpoint_interval_epochs: 10
eval_rollouts: 100

# --- Model-specific configs ---
iql:
  tau: 0.005
  temperature: 3.0
  expectile: 0.7
  hidden_size: 256
cql:
  tau: 0.005
  temperature: 1.0
  hidden_size: 256
  with_lagrange: false
  cql_weight: 1.0
  target_action_gap: 10.0