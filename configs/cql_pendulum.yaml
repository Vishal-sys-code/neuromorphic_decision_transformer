env: Pendulum-v1
dataset: data/pendulum_random.pkl
seq_len: 20
batch_size: 64
hidden_dim: 128
n_layers: 4
learning_rate: 1e-4
epochs: 1000
eval_every: 10
checkpoint_every: 50
num_workers: 1

cql:
  tau: 0.005
  hidden_size: 256
  with_lagrange: true
  temperature: 1.0
  cql_weight: 5.0
  target_action_gap: 10.0
