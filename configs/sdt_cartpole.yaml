# @package _global_

# SNN-DT specific config for CartPole-v1
seq_len: 10
hidden_dim: 64
n_heads: 2
n_layers: 1
batch_size: 32
learning_rate: 5e-4
weight_decay: 0.0
epochs: 1000
eval_every: 10
checkpoint_every: 50
batches_per_epoch: 100
num_workers: 0

# SNN specific
snn:
  lif_tau: 20.0
  surrogate_k: 25.0
  v_th: 1.0
  current_scale: 0.2
  biological_time: 4
  use_plasticity: false