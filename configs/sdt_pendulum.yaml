env: Pendulum-v1
dataset: data/pendulum_random.pkl
seq_len: 20
batch_size: 32
hidden_dim: 128
n_layers: 4
learning_rate: 1e-4
epochs: 1000
eval_every: 10
checkpoint_every: 50
seed: 42
num_workers: 0

# SNN-specific hyperparameters
snn:
  lif_tau: 20.0
  surrogate_k: 25.0
  v_th: 1.0
  current_scale: 0.2
  biological_time: 4
  use_plasticity: false